    <!-- Set theme before paint to avoid a flash -->
    <script>
      (function () {
        try {
          var onSite = location.pathname.indexOf('/admin') !== 0;
          var t = onSite ? 'dark' : (localStorage.getItem('theme') || 'light');
          document.documentElement.setAttribute('data-theme', t);
          if (onSite) document.documentElement.style.background = '#0b0c0f';
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
