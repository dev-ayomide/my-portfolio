name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 2 days at 00:00 UTC
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    
    steps:
      - name: Ping Supabase Database
        run: |
          curl -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/projects?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            --fail || echo "Keep-alive ping sent"
      
      - name: Log success
        run: |
          echo "✅ Supabase keep-alive successful at $(date)"

      - name: Keep GitHub Action alive
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true

