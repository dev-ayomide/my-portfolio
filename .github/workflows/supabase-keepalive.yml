name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 2 days at 00:00 UTC
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    # permissions:
    #   actions: write
    #   contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "⚠️ SUPABASE_URL is missing. Skipping ping."
            exit 0
          fi
          
          CLEAN_URL=$(echo $SUPABASE_URL | sed 's/\/$//')
          echo "Pinging Supabase REST API..."
          curl -s -o /dev/null -w "%{http_code}" -X GET \
            "$CLEAN_URL/rest/v1/projects?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"

